<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quark Trading Vault & Journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #080a0f;
      color: #e2e8f0;
    }
    .gold-active {
      background-color: #2b2312;
      border: 1px solid #856725;
      color: #e5b949;
    }
    .gold-btn {
      background: linear-gradient(135deg, #d4a537 0%, #b0821e 100%);
      color: #080a0f;
      font-weight: 700;
    }
    .gold-btn:hover {
      filter: brightness(1.1);
    }
    .input-dark {
      background-color: #0b0d13;
      border: 1px solid #1e2330;
      color: #f8fafc;
    }
    .input-dark:focus {
      outline: none;
      border-color: #d4a537;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- AUTHENTICATION MODAL / SCREEN -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#080a0f] px-4">
    <div class="w-full max-w-md bg-[#0d1017] border border-[#1c212e] rounded-2xl p-8 shadow-2xl">
      
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-white tracking-tight mb-2">QUARK TRADING VAULT</h1>
        <p id="auth-subtitle" class="text-sm text-slate-400">
          Create your master account to lock & protect your existing trading data.
        </p>
      </div>

      <!-- Mode Switcher -->
      <div class="grid grid-cols-2 gap-2 p-1.5 bg-[#11151f] border border-[#1f2433] rounded-xl mb-6">
        <button id="tab-login" onclick="switchAuthMode('login')" class="py-2.5 text-sm font-semibold rounded-lg text-slate-400 transition">
          Login Terminal
        </button>
        <button id="tab-register" onclick="switchAuthMode('register')" class="py-2.5 text-sm font-semibold rounded-lg gold-active transition">
          Create Account
        </button>
      </div>

      <!-- Error / Status Box -->
      <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-xs font-medium"></div>

      <!-- Form -->
      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
            TRADER ID / EMAIL
          </label>
          <input
            type="text"
            id="trader-id"
            required
            placeholder="e.g. trader@quark.io"
            class="w-full px-4 py-3.5 rounded-xl input-dark text-sm"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
            VAULT PASSWORD / PIN
          </label>
          <input
            type="password"
            id="vault-pin"
            required
            placeholder="••••••••"
            class="w-full px-4 py-3.5 rounded-xl input-dark text-sm"
          />
        </div>

        <!-- Hardcoded Firebase Cloud Sync (Hidden from Users) -->
        <input
          type="hidden"
          id="firebase-url"
          value="https://quark-journal-default-rtdb.firebaseio.com"
        />

        <button
          type="submit"
          id="auth-submit-btn"
          class="w-full py-3.5 rounded-xl gold-btn text-sm uppercase tracking-wider transition shadow-lg"
        >
          Initialize Master Vault
        </button>
      </form>

      <div class="mt-5 flex items-center justify-center gap-2 text-xs text-emerald-400/80">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Cloud Sync Active (Quark Realtime DB)</span>
      </div>
    </div>
  </div>

  <!-- MAIN TRADING JOURNAL DASHBOARD -->
  <div id="app-dashboard" class="hidden flex-1 flex flex-col max-w-6xl w-full mx-auto px-4 py-8">
    <!-- Top Bar -->
    <header class="flex flex-wrap items-center justify-between gap-4 pb-6 mb-8 border-b border-[#1c212e]">
      <div>
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
          <span>QUARK TERMINAL</span>
          <span id="sync-badge" class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            Synced
          </span>
        </h2>
        <p class="text-xs text-slate-400 mt-0.5">
          Logged in as: <span id="active-trader-display" class="text-amber-400 font-medium"></span>
        </p>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="syncFromCloud()" class="px-3.5 py-2 rounded-lg bg-[#131824] border border-[#232a3d] text-xs font-medium text-slate-300 hover:text-white transition">
          Refresh Cloud
        </button>
        <button onclick="logout()" class="px-3.5 py-2 rounded-lg bg-rose-500/10 border border-rose-500/20 text-xs font-medium text-rose-400 hover:bg-rose-500/20 transition">
          Lock Vault
        </button>
      </div>
    </header>

    <!-- Stats Row -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
      <div class="bg-[#0d1017] border border-[#1c212e] p-5 rounded-xl">
        <p class="text-xs uppercase tracking-wider text-slate-400">Total Net P&L</p>
        <p id="stat-pnl" class="text-2xl font-bold mt-1 text-white">$0.00</p>
      </div>
      <div class="bg-[#0d1017] border border-[#1c212e] p-5 rounded-xl">
        <p class="text-xs uppercase tracking-wider text-slate-400">Win Rate</p>
        <p id="stat-winrate" class="text-2xl font-bold mt-1 text-white">0%</p>
      </div>
      <div class="bg-[#0d1017] border border-[#1c212e] p-5 rounded-xl">
        <p class="text-xs uppercase tracking-wider text-slate-400">Total Trades</p>
        <p id="stat-total" class="text-2xl font-bold mt-1 text-white">0</p>
      </div>
    </div>

    <!-- Log New Trade & Trade History -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Trade Entry Form -->
      <div class="bg-[#0d1017] border border-[#1c212e] p-6 rounded-xl h-fit">
        <h3 class="text-sm font-bold uppercase tracking-wider text-amber-400 mb-4">Log New Trade</h3>
        <form id="trade-form" onsubmit="addTrade(event)" class="space-y-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Symbol / Pair</label>
            <input type="text" id="t-symbol" required placeholder="e.g. BTCUSDT, XAUUSD, NVDA" class="w-full px-3.5 py-2.5 rounded-lg input-dark text-sm uppercase" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Direction</label>
              <select id="t-side" class="w-full px-3.5 py-2.5 rounded-lg input-dark text-sm">
                <option value="LONG">LONG</option>
                <option value="SHORT">SHORT</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Net P&L ($)</label>
              <input type="number" step="any" id="t-pnl" required placeholder="e.g. 250 or -100" class="w-full px-3.5 py-2.5 rounded-lg input-dark text-sm" />
            </div>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Setup / Notes</label>
            <textarea id="t-notes" rows="2" placeholder="Breakout retest, followed plan..." class="w-full px-3.5 py-2.5 rounded-lg input-dark text-sm"></textarea>
          </div>
          <button type="submit" class="w-full py-3 rounded-lg gold-btn text-xs uppercase tracking-wider">
            Save & Sync Trade
          </button>
        </form>
      </div>

      <!-- Trade History Table -->
      <div class="lg:col-span-2 bg-[#0d1017] border border-[#1c212e] p-6 rounded-xl">
        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 mb-4">Cloud Trade Ledger</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-[#1c212e] text-xs text-slate-400 uppercase">
                <th class="py-3 px-2">Date</th>
                <th class="py-3 px-2">Pair</th>
                <th class="py-3 px-2">Side</th>
                <th class="py-3 px-2">P&L</th>
                <th class="py-3 px-2">Notes</th>
                <th class="py-3 px-2 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="trade-list" class="text-sm divide-y divide-[#151924]"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================================
    // HARDCODED FIREBASE CONFIGURATION (Automatic for all users)
    // ============================================================================
    const FIREBASE_DB_URL = "https://quark-journal-default-rtdb.firebaseio.com";

    let authMode = "register";
    let currentUser = null;
    let trades = [];

    // Sanitize Trader ID / Email so it works cleanly as a Firebase JSON key
    function cleanKey(id) {
      return id.trim().toLowerCase().replace(/[.#$\[\]@\/]/g, "_");
    }

    function switchAuthMode(mode) {
      authMode = mode;
      const loginTab = document.getElementById("tab-login");
      const registerTab = document.getElementById("tab-register");
      const submitBtn = document.getElementById("auth-submit-btn");
      const subtitle = document.getElementById("auth-subtitle");
      hideAlert();

      if (mode === "login") {
        loginTab.className = "py-2.5 text-sm font-semibold rounded-lg gold-active transition";
        registerTab.className = "py-2.5 text-sm font-semibold rounded-lg text-slate-400 transition";
        submitBtn.textContent = "Unlock Trading Vault";
        subtitle.textContent = "Sign in with your Trader ID to sync your cloud trading data.";
      } else {
        registerTab.className = "py-2.5 text-sm font-semibold rounded-lg gold-active transition";
        loginTab.className = "py-2.5 text-sm font-semibold rounded-lg text-slate-400 transition";
        submitBtn.textContent = "Create Account";
        subtitle.textContent = "Create your master account to lock & protect your existing trading data.";
      }
    }

    function showAlert(msg, isError = true) {
      const box = document.getElementById("auth-alert");
      box.textContent = msg;
      box.className = `mb-4 p-3 rounded-lg text-xs font-medium ${
        isError
          ? "bg-rose-500/10 border border-rose-500/30 text-rose-400"
          : "bg-emerald-500/10 border border-emerald-500/30 text-emerald-400"
      }`;
      box.classList.remove("hidden");
    }

    function hideAlert() {
      document.getElementById("auth-alert").classList.add("hidden");
    }

    async function handleAuth(e) {
      e.preventDefault();
      hideAlert();

      const rawId = document.getElementById("trader-id").value.trim();
      const pin = document.getElementById("vault-pin").value.trim();
      const userKey = cleanKey(rawId);
      const btn = document.getElementById("auth-submit-btn");

      btn.disabled = true;
      btn.textContent = "Connecting to Cloud Vault...";

      try {
        const res = await fetch(`${FIREBASE_DB_URL}/traders/${userKey}.json`);
        const existingUser = await res.json();

        if (authMode === "register") {
          if (existingUser && existingUser.pin) {
            showAlert("This Trader ID already exists! Switch to 'Login Terminal' to sign in.");
            btn.disabled = false;
            btn.textContent = "Create Account";
            return;
          }

          const payload = {
            traderId: rawId,
            pin: pin,
            createdAt: new Date().toISOString(),
            trades: []
          };

          await fetch(`${FIREBASE_DB_URL}/traders/${userKey}.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          completeLogin(rawId, userKey, []);
        } else {
          // LOGIN MODE
          if (!existingUser || !existingUser.pin) {
            showAlert("Trader ID not found. Switch to 'Create Account' to register.");
            btn.disabled = false;
            btn.textContent = "Unlock Trading Vault";
            return;
          }

          if (existingUser.pin !== pin) {
            showAlert("Invalid Vault Password / PIN.");
            btn.disabled = false;
            btn.textContent = "Unlock Trading Vault";
            return;
          }

          completeLogin(existingUser.traderId || rawId, userKey, existingUser.trades || []);
        }
      } catch (err) {
        showAlert("Cloud error: Make sure your Firebase Rules are published as true.");
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    }

    function completeLogin(traderId, userKey, userTrades) {
      currentUser = { traderId, userKey };
      trades = Array.isArray(userTrades) ? userTrades : Object.values(userTrades || {});
      localStorage.setItem("quark_active_user", JSON.stringify(currentUser));

      document.getElementById("auth-screen").classList.add("hidden");
      document.getElementById("app-dashboard").classList.remove("hidden");
      document.getElementById("active-trader-display").textContent = traderId;
      renderTrades();
    }

    async function saveTradesToCloud() {
      if (!currentUser) return;
      const badge = document.getElementById("sync-badge");
      badge.textContent = "Syncing...";

      try {
        await fetch(`${FIREBASE_DB_URL}/traders/${currentUser.userKey}/trades.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(trades)
        });
        badge.textContent = "Synced";
      } catch (e) {
        badge.textContent = "Sync Error";
        console.error(e);
      }
    }

    async function syncFromCloud() {
      if (!currentUser) return;
      const badge = document.getElementById("sync-badge");
      badge.textContent = "Fetching...";
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/traders/${currentUser.userKey}/trades.json`);
        const data = await res.json();
        trades = Array.isArray(data) ? data : Object.values(data || {});
        renderTrades();
        badge.textContent = "Synced";
      } catch (e) {
        badge.textContent = "Offline";
      }
    }

    async function addTrade(e) {
      e.preventDefault();
      const symbol = document.getElementById("t-symbol").value.trim().toUpperCase();
      const side = document.getElementById("t-side").value;
      const pnl = parseFloat(document.getElementById("t-pnl").value);
      const notes = document.getElementById("t-notes").value.trim();

      const newTrade = {
        id: Date.now(),
        date: new Date().toLocaleDateString(),
        symbol,
        side,
        pnl,
        notes
      };

      trades.unshift(newTrade);
      document.getElementById("trade-form").reset();
      renderTrades();
      await saveTradesToCloud();
    }

    async function deleteTrade(id) {
      trades = trades.filter(t => t.id !== id);
      renderTrades();
      await saveTradesToCloud();
    }

    function renderTrades() {
      const list = document.getElementById("trade-list");
      list.innerHTML = "";

      let netPnl = 0;
      let wins = 0;

      trades.forEach(t => {
        netPnl += Number(t.pnl);
        if (Number(t.pnl) > 0) wins++;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="py-3 px-2 text-slate-400 text-xs">${t.date}</td>
          <td class="py-3 px-2 font-semibold text-white">${t.symbol}</td>
          <td class="py-3 px-2">
            <span class="px-2 py-0.5 rounded text-xs font-bold ${
              t.side === "LONG" ? "bg-emerald-500/10 text-emerald-400" : "bg-rose-500/10 text-rose-400"
            }">${t.side}</span>
          </td>
          <td class="py-3 px-2 font-bold ${Number(t.pnl) >= 0 ? "text-emerald-400" : "text-rose-400"}">
            ${Number(t.pnl) >= 0 ? "+" : ""}$${Number(t.pnl).toFixed(2)}
          </td>
          <td class="py-3 px-2 text-slate-400 text-xs">${t.notes || "-"}</td>
          <td class="py-3 px-2 text-right">
            <button onclick="deleteTrade(${t.id})" class="text-xs text-rose-400 hover:underline">Delete</button>
          </td>
        `;
        list.appendChild(tr);
      });

      const pnlEl = document.getElementById("stat-pnl");
      pnlEl.textContent = `${netPnl >= 0 ? "+" : ""}$${netPnl.toFixed(2)}`;
      pnlEl.className = `text-2xl font-bold mt-1 ${netPnl >= 0 ? "text-emerald-400" : "text-rose-400"}`;

      const winrate = trades.length ? Math.round((wins / trades.length) * 100) : 0;
      document.getElementById("stat-winrate").textContent = `${winrate}%`;
      document.getElementById("stat-total").textContent = trades.length;
    }

    function logout() {
      localStorage.removeItem("quark_active_user");
      currentUser = null;
      trades = [];
      document.getElementById("app-dashboard").classList.add("hidden");
      document.getElementById("auth-screen").classList.remove("hidden");
      switchAuthMode("login");
    }

    // Auto-restore session if logged in previously
    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("quark_active_user");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          currentUser = parsed;
          document.getElementById("auth-screen").classList.add("hidden");
          document.getElementById("app-dashboard").classList.remove("hidden");
          document.getElementById("active-trader-display").textContent = parsed.traderId;
          syncFromCloud();
        } catch (e) {}
      }
    });
  </script>
</body>
</html>
